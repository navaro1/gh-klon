[package]
name = "gh-klon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
build = "build.rs"
description = "A git worktree replacement that spawns a warm copy of a project for each coding agent"
repository = "https://github.com/navaro1/gh-klon"

[[bin]]
name = "gh-klon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
filetime = "0.2"
grep-matcher = "0.1"
grep-searcher = "0.1"
ignore = "0.4.33"
libc = "0.2"
memchr = "2"
rayon = "1.12"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
