[package]
name = "gh-klon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A git worktree replacement that spawns a warm copy of a project for each coding agent"
repository = "https://github.com/navaro1/gh-klon"

[[bin]]
name = "gh-klon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4.33"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
