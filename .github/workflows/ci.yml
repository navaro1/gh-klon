# CI for gh-klon (spec section 7, C2).
#
# The `test` job runs on every push and pull request. It checks the format,
# runs clippy with warnings as errors, and runs the whole test suite on both
# supported operating systems. Tests that need an absent host feature print a
# skip reason and pass.
#
# The `nightly` job runs the 100k-fixture timing test. It runs on a schedule
# and through `workflow_dispatch` only, so pull requests stay fast.
#
# The `loop-fs` job builds an xfs and a btrfs loop filesystem and runs the
# backend tests on each, then the C7 snapshot and `init` tests on btrfs. It is
# the only proof for the copy-on-write acceptance lines and for the O(1)
# subvolume delete, because the development laptop runs ext4 and its udisks
# refuses `user_subvol_rm_allowed` (S1 §8).
#
# Later chunks extend this file: C32 adds a release workflow beside it.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every day at 03:17 UTC. An off-minute avoids the top-of-hour load peak.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel the superseded run of the same ref. Leave runs of other refs alone.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked fails a pull request that changes Cargo.toml without a
      # matching Cargo.lock update, before clippy can rewrite the lock.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The copy-on-write backends need a filesystem that answers FICLONE. The
  # development laptop runs ext4 and has no btrfs-progs, so this job is the only
  # proof for those acceptance lines of C5. Two loop images give one xfs mount
  # with reflink and one btrfs mount. The scheduled run adds the 100k timing.
  loop-fs:
    name: backend tests on the xfs and btrfs loop filesystems (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The 100k fixture needs room for golden, its object store, and the clone.
      IMAGE_SIZE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '10G' || '2G' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs xfsprogs
      # `reflink=1` is the xfs default today. The flag is explicit, so a changed
      # default cannot disable the test without a failure here.
      - name: Create the xfs loop filesystem
        run: |
          set -eux
          truncate -s "$IMAGE_SIZE" "$RUNNER_TEMP/xfs.img"
          mkfs.xfs -q -f -m reflink=1 "$RUNNER_TEMP/xfs.img"
          sudo mkdir -p /mnt/klon-xfs
          sudo mount -o loop "$RUNNER_TEMP/xfs.img" /mnt/klon-xfs
          sudo mkdir -p /mnt/klon-xfs/work
          sudo chown "$(id -u):$(id -g)" /mnt/klon-xfs/work
      # `user_subvol_rm_allowed` lets C7 delete a subvolume without sudo.
      - name: Create the btrfs loop filesystem
        run: |
          set -eux
          truncate -s "$IMAGE_SIZE" "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q -f "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/klon-btrfs
          sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/btrfs.img" /mnt/klon-btrfs
          sudo mkdir -p /mnt/klon-btrfs/work
          sudo chown "$(id -u):$(id -g)" /mnt/klon-btrfs/work
      - name: Report the two mounts
        run: |
          findmnt -no FSTYPE,OPTIONS /mnt/klon-xfs
          findmnt -no FSTYPE,OPTIONS /mnt/klon-btrfs
      - name: Backend tests on xfs
        env:
          KLON_TEST_REFLINK_DIR: /mnt/klon-xfs/work
        run: cargo test --locked --test backend -- --nocapture
      # btrfs answers FICLONE on a plain directory, so the same tests run again.
      - name: Backend tests on btrfs
        env:
          KLON_TEST_REFLINK_DIR: /mnt/klon-btrfs/work
          KLON_TEST_BTRFS_DIR: /mnt/klon-btrfs/work
        run: cargo test --locked --test backend -- --nocapture
      # C7: the `btrfs-snapshot` backend and `gh klon init`. The mount carries
      # `user_subvol_rm_allowed`, so this job is the only proof for the O(1)
      # subvolume delete. `SUDO_ASKPASS=/bin/false` keeps the zero-password rule
      # even though this runner needs no udisks.
      - name: The btrfs snapshot backend and init
        env:
          KLON_TEST_BTRFS_DIR: /mnt/klon-btrfs/work
          SUDO_ASKPASS: /bin/false
        run: cargo test --locked --test btrfs -- --nocapture
      # The 100k reflink budget of 10 s. It needs a big fixture, so it runs on
      # the schedule and on demand only, like the other 100k cell.
      - name: The 100k reflink walk on xfs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          KLON_FIXTURE: 100k
          KLON_TEST_REFLINK_DIR: /mnt/klon-xfs/work
        run: cargo test --locked --release --test backend -- --nocapture reflink_walk_of_the_100k
      # The 100k snapshot cell. It shares the schedule with the reflink one.
      - name: The 100k btrfs snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          KLON_FIXTURE: 100k
          KLON_TEST_BTRFS_DIR: /mnt/klon-btrfs/work
          SUDO_ASKPASS: /bin/false
        run: cargo test --locked --release --test btrfs -- --nocapture add_of_the_100k

  nightly:
    name: nightly, 100k fixture (ubuntu-22.04)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the 100k-fixture test
        run: KLON_FIXTURE=100k cargo test --release add_100k -- --nocapture
