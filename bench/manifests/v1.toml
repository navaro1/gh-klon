# The gh klon benchmark manifest, version 1 (spec R14, handoff section 8).
#
# The manifest fixes everything about a run before the run starts: the fixture
# seed and shape, the cells, the run counts, the timer points, and the pass
# rule. `gh klon bench` embeds this file at build time, so a binary always
# carries the manifest it was built with. `fixture_hash` in the report is a
# hash of `seed` and of every profile below. Two results are comparable only
# when their `fixture_hash` values match.
#
# Edit this file to change the benchmark. Do not edit it to make a number look
# better: a changed seed or shape gives a new hash, and the report says so.

version = 1

# The seed of every fixture. It fixes the file bytes and the commit dates, so
# two hosts that build one profile get the same repository.
seed = 20260905

[runs]
# A development run. Enough samples for a p50 and a rough p95.
warm = 10
cold = 5
# A release claim. `--release` selects these two counts.
release_warm = 30
release_cold = 10
# The `git status` calls after the first one, per M4 sample. They feed the
# `steady_samples_ms` series.
steady_calls = 3
# The builds alone behind `t_solo_ms` of an M12 cell. Their median is the ideal
# that the concurrent run is measured against.
solo = 3

# --- Fixture profiles ---------------------------------------------------------
#
# A profile is one generated repository: `tracked_files` files spread over
# `dirs` directories, `ignored_files` files of `ignored_file_bytes` bytes each
# in the ignored `build/` directory, and a `feature` branch that changes
# `changed_files` tracked files and adds `added_files` new ones.

# 10k tracked files and 250 MB of ignored build state.
[profiles.p10k]
tracked_files = 10000
dirs = 100
ignored_files = 2500
ignored_file_bytes = 100000
changed_files = 20
added_files = 2

# 100k tracked files and 2 GB of ignored build state. Only a run with
# `KLON_FIXTURE=100k` builds this profile.
[profiles.p100k]
tracked_files = 100000
dirs = 1000
ignored_files = 20000
ignored_file_bytes = 100000
changed_files = 20
added_files = 2

# --- Cells --------------------------------------------------------------------
#
# Every cell runs twice: once for the backend that klon probes on this host and
# once for the `git worktree add` baseline. The two records carry one cell name
# and differ in `backend`.
#
# `timer` names the timer points. `process` means that the sample starts just
# before klon spawns the child and stops when the child has exited, so the
# number is the latency that a user waits for. The rest of a sample is outside
# the timer: the fixture build, the tree that a sample needs before the
# measured command, the teardown, and the correctness check.
#
# `fixture` names the repository that a cell measures: `synthetic` (the default,
# the generated file tree above), `rust` (a cargo workspace of `crates` member
# crates with `functions` generated functions each), or `pnpm` (one package that
# depends on a tarball inside the fixture). An ecosystem cell reads `crates` and
# `functions` instead of the profile shape; those two are outside `fixture_hash`
# on purpose, so a C8 result and a C31 result of one profile still compare, and
# every record prints its own `fixture_shape`.
#
# A cell whose tool is absent is skipped with a reason. `cargo` is a rust cell's
# tool; `pnpm`, `node`, and `tar` are a pnpm cell's.

[[cells]]
name = "m1-add-10k"
metric = "M1"
profile = "p10k"
action = "add"
timer = "process: gh klon add, or git worktree add, from spawn to exit"
# M1: spawn to an editable tree, p50 of 1 s or less in v0.
pass_p50_ms = 1000

[[cells]]
name = "m1-add-100k"
metric = "M1"
profile = "p100k"
action = "add"
timer = "process: gh klon add, or git worktree add, from spawn to exit"
pass_p50_ms = 1000
requires_fixture = "100k"

[[cells]]
name = "m4-status-100k"
metric = "M4"
profile = "p100k"
action = "status"
timer = "process: git status --porcelain in the new tree, from spawn to exit"
# M4: the first call in a fresh klon takes 500 ms or less; a later call 150 ms
# or less.
pass_p50_ms = 500
pass_steady_p50_ms = 150
requires_fixture = "100k"

[[cells]]
name = "m6-rm-100k"
metric = "M6"
profile = "p100k"
action = "rm"
timer = "process: gh klon rm --path, or git worktree remove --force, from spawn to exit"
# M6: the command returns in 100 ms or less. The delete finishes in the
# background.
pass_p50_ms = 100
requires_fixture = "100k"

# --- The v2 cells (C31) -------------------------------------------------------

# M2: the time to a usable warm tree, not the time until the command returned.
# The timer starts before klon spawns `add` and stops when the tree's ignored
# state first equals golden's. The measurement therefore holds whether the copy
# runs inside `add` or behind it in the background.
#
# The handoff sets no number for M2 in v0. The budget below is the ceiling of a
# whole-directory copy of the profile's ignored state on the development laptop;
# a reflink or a snapshot host lands two orders of magnitude below it.
[[cells]]
name = "m2-warm-10k"
metric = "M2"
profile = "p10k"
action = "warm"
timer = "poll: from the start of gh klon add until the ignored state of the new tree equals golden's"
pass_p50_ms = 15000

[[cells]]
name = "m2-warm-100k"
metric = "M2"
profile = "p100k"
action = "warm"
timer = "poll: from the start of gh klon add until the ignored state of the new tree equals golden's"
pass_p50_ms = 60000
requires_fixture = "100k"

# M3: what the first build in a fresh klon of a warm golden compiles. R10 asks
# for zero. The build runs directly in the tree, not under `gh klon run`: the
# envelope changes neither the unit count nor the answer.
#
# The time budget is a guard, not the metric: a klon that compiled the whole
# workspace again would blow it. `pass_units_compiled` is the rule.
[[cells]]
name = "m3-zero-compile-rust"
metric = "M3"
profile = "p10k"
action = "build"
fixture = "rust"
crates = 4
functions = 50
timer = "process: cargo build --offline in the new tree, from spawn to exit"
pass_p50_ms = 60000
pass_units_compiled = 0

# The pnpm store sits beside golden, so golden, a klon, and a baseline worktree
# all reach it. The klon must still install nothing: its `node_modules` came
# with the ignored state and the fixup pass rewrote the absolute paths inside
# `.modules.yaml` (handoff §9). The baseline has no `node_modules`, so it links
# the package again; that difference is the metric.
[[cells]]
name = "m3-zero-compile-pnpm"
metric = "M3"
profile = "p10k"
action = "build"
fixture = "pnpm"
timer = "process: pnpm install --frozen-lockfile --offline in the new tree, from spawn to exit"
pass_p50_ms = 60000
pass_units_compiled = 0

# M5: the bytes that one idle tree alone holds. On btrfs `btrfs fi du -s --raw`
# reports the exclusive extents and the record says `btrfs-fi-du`; every other
# host gets the apparent size of the tree and the record says `upper-bound`.
# There is no v0 budget for the figure itself; the time budget guards the walk.
[[cells]]
name = "m5-disk-100k"
metric = "M5"
profile = "p100k"
action = "disk"
timer = "process: the unique-byte measurement over an idle tree, from start to finish"
pass_p50_ms = 60000
requires_fixture = "100k"

# M12: `ratio = (builders × t_solo) / t_wall`. One means that six builders
# together cost exactly six times one builder alone; 0.80 allows a quarter of
# the time to contention.
#
# `crates` is above the token count on purpose. A solo build must already fill
# the pool, or the six-way run would beat it for free and the ratio would say
# nothing about contention.
#
# The golden of this cell is cold: every builder compiles the whole workspace.
# Each klon build runs under `gh klon run`, so the jobserver, the resource
# scope, and the write fence are inside the timer; the baseline builds bare.
[[cells]]
name = "m12-throughput-n6"
metric = "M12"
profile = "p10k"
action = "throughput"
fixture = "rust"
crates = 24
functions = 200
builders = 6
timer = "wall: from the first build start to the last build finish of the concurrent builders"
pass_p50_ms = 300000
pass_ratio = 0.80
